{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=4">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a href="{% url 'home' %}" class="navbar-brand mb-0 h1 text-decoration-none">🎬 StreamHub</a>
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'watchlist:list' %}" class="btn btn-sm btn-outline-light">My Watchlist</a>
                <span>Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-light">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container-fluid px-3 py-2">
    {% block content %}{% endblock %}
</div>
<script src="{% static 'js/watchlist.js' %}?v=1" defer></script>
</body>
</html>
