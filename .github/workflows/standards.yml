name: Repository standards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Test badge tooling
        run: python3 -m unittest tests.test_badges -v

      - name: Audit required repository documents
        run: python3 scripts/audit.py --check

      - name: Verify README badges
        run: python3 scripts/badges.py --mode check
