name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          compose_output="$(docker compose config --quiet 2>&1)" || {
            printf '%s\n' "$compose_output"
            exit 1
          }
          if [ -n "$compose_output" ]; then
            printf '%s\n' "$compose_output"
            exit 1
          fi

      - name: Check migration drift
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py makemigrations --check --dry-run

      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check

      - name: Verify modular test packages
        run: |
          test -f core/__init__.py
          test -f watchlist/__init__.py

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py test
