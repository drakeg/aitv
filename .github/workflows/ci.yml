name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          compose_output="$(docker compose config --quiet 2>&1)" || {
            printf '%s\n' "$compose_output"
            exit 1
          }
          if [ -n "$compose_output" ]; then
            printf '%s\n' "$compose_output"
            exit 1
          fi

      - name: Validate production Docker Compose config
        run: |
          cp .env.production.example .env.production
          compose_output="$(docker compose --env-file .env.production -f compose.production.yml config --quiet 2>&1)" || {
            printf '%s\n' "$compose_output"
            exit 1
          }
          if [ -n "$compose_output" ]; then
            printf '%s\n' "$compose_output"
            exit 1
          fi
          sh -n scripts/start-production.sh

      - name: Validate static JavaScript syntax
        run: |
          for file in static/js/*.js; do
            node --check "$file"
          done

      - name: Validate staticfiles storage modes
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          DJANGO_DEBUG=true python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'streamhub.settings'); from django.conf import settings; assert settings.STORAGES['staticfiles']['BACKEND'] == 'django.contrib.staticfiles.storage.StaticFilesStorage'"
          DJANGO_DEBUG=false python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'streamhub.settings'); from django.conf import settings; assert settings.STORAGES['staticfiles']['BACKEND'] == 'whitenoise.storage.CompressedManifestStaticFilesStorage'"

      - name: Check migration drift
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py makemigrations --check --dry-run

      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check

      - name: Validate production Caddy config
        run: |
          docker run --rm \
            -e PUBLIC_HOST=example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Smoke-test production application image
        run: |
          docker build -t aitv-production-ci .
          docker run -d --name aitv-production-smoke \
            -p 127.0.0.1:18000:8000 \
            -e DJANGO_SECRET_KEY=ci-production-secret-key-with-more-than-fifty-characters-1234567890 \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DJANGO_DEBUG=false \
            -e DJANGO_TRUST_PROXY_HEADERS=true \
            -e DJANGO_SECURE_SSL_REDIRECT=true \
            -e DJANGO_SESSION_COOKIE_SECURE=true \
            -e DJANGO_CSRF_COOKIE_SECURE=true \
            -e DJANGO_SECURE_HSTS_SECONDS=31536000 \
            -e DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=true \
            -e DJANGO_SECURE_HSTS_PRELOAD=true \
            -e SQLITE_DB_PATH=/tmp/aitv-production-ci.sqlite3 \
            aitv-production-ci sh /app/scripts/start-production.sh
          trap 'docker logs aitv-production-smoke || true; docker rm -f aitv-production-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              -H 'Host: localhost' \
              -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18000/health/live/; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Django production deployment checks
        env:
          DJANGO_SECRET_KEY: ci-production-secret-key-with-more-than-fifty-characters-1234567890
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_TRUST_PROXY_HEADERS: 'true'
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SESSION_COOKIE_SECURE: 'true'
          DJANGO_CSRF_COOKIE_SECURE: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '31536000'
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput

      - name: Verify modular test packages
        run: |
          test -f core/__init__.py
          test -f watchlist/__init__.py

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py test
